provider: Universiti Teknologi Malaysia
providerId: utm
description: >-
  Identity federation is the surface class a university operates by definition, and for UTM it
  is the only fully specified, anonymously readable machine contract in this profile. UTM does
  not run a Shibboleth identity provider on its own hardware; it runs a Microsoft Entra ID
  tenant, and the entityID, signing keys, SSO/SLO bindings and OIDC endpoints of that tenant
  are published as signed SAML 2.0 metadata and as an OIDC discovery document that any client
  can read without credentials.

  The metadata is served from login.microsoftonline.com, which is Microsoft's host and shared
  by every Entra customer, but the entity described is UTM's own directory and nobody else's:
  the tenant GUID is UTM's, the verified domain is utm.my, and the federation brand name
  returned by realm discovery is "Universiti Teknologi Malaysia". The university pipeline
  classes this as `federation`, not `vendor` — the host is shared because federation metadata
  is shared by definition, and the identity provider behind it is the institution's.

  No entry for UTM was found in the eduGAIN metadata aggregate (7.8 MB parsed on 2026-09-01,
  zero matches on "utm.my" or "teknologi malaysia"), so UTM's IdP is not visible to
  interfederated services outside Malaysia through that route. SIFULAN, the Malaysian Access
  Federation, returned HTTP 403 to every probe from this environment and could not be read, so
  UTM's SIFULAN membership is neither confirmed nor denied here.

