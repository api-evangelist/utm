specification: API Evangelist Domain Standard Conformance
specificationVersion: '0.1'
provider: Universiti Teknologi Malaysia
providerId: utm
regime: education
generated: '2026-09-01'
method: probed
source: >-
  Live probe sweep of Universiti Teknologi Malaysia surfaces on 2026-09-01, evaluated against
  the Kin Score `education` regime standards list (scim, lti, oneroster, ed-fi, caliper, qti,
  oai-pmh, shibboleth, saml, orcid, datacite, crossref). Every hit below was read from a
  response, never from a prose claim. Operator was settled by IP ownership as well as
  hostname: whois on 161.139.0.0/16 returns netname UTM-MY, "Universiti Teknologi Malaysia",
  country MY, and utmik.utm.my (161.139.22.165), journals.utm.my (161.139.22.105),
  eprints.utm.my (161.139.21.110) and www.utm.my (161.139.22.123) all sit inside it.
description: >-
  Reward-only. A standard is recorded as conformant for UTM only where an
  institution-operated surface demonstrated it in a live response. UTM makes no public
  conformance claims anywhere — there is no developer portal and no standards page — so
  everything here was found by probing.

  Two of the four hits sit on repository and journal software UTM did not write (DSpace-CRIS
  and PKP Open Journal Systems). The OAI-PMH conformance is still UTM's: UTM chose to expose
  the protocol, runs the endpoint on its own address space, and answers as
  "UTMIK Repository" and "UTM Press Journal Management" with UTM administrative contacts. The
  software vendor's own contract is not saved into this repository.

standards:
- id: oai-pmh
  name: Open Archives Initiative Protocol for Metadata Harvesting 2.0
  version: '2.0'
  status: confirmed
  x-operator: institution
  confidence: high
  evidence: >-
    Two independent institution-operated OAI-PMH 2.0 endpoints answered a live Identify verb.
    The UTMIK Repository (DSpace-CRIS) returns repositoryName "UTMIK Repository", baseURL
    https://utmik.utm.my/server/oai/request, protocolVersion 2.0, adminEmail
    library.automation@utm.my, earliestDatestamp 2025-01-27T08:59:54Z, granularity
    YYYY-MM-DDThh:mm:ssZ, deletedRecord transient, oai-identifier repositoryIdentifier
    utmik.utm.my, plus an OpenAIRE CERIF-for-CRIS 1.1 Service description advertising a second
    base URL at https://utmik.utm.my/server/oai/openairecris. ListMetadataFormats returns
    twelve prefixes (oai_dc, qdc, mods, mets, didl, ore, rdf, marc, dim, etdms, rioxx,
    uketd_dc) and ListSets returns UTM-specific sets including RESEARCH DATA, SCHOLARLY
    PUBLICATION, UTM ARCHIVE, UTM LENSES and CITIZEN SCIENCE. The UTM Press journal platform
    returns repositoryName "UTM Press Journal Management powered by OJS", baseURL
    https://journals.utm.my/index/oai, protocolVersion 2.0, adminEmail journal_utm@utm.my,
    earliestDatestamp 2011-12-12T09:13:50Z.
  location: https://utmik.utm.my/server/oai/request?verb=Identify
  status_code: 200
  secondary_location: https://journals.utm.my/index.php/index/oai?verb=Identify
  secondary_status_code: 200
- id: crossref
  name: Crossref DOI registration
  status: confirmed
  x-operator: institution
  confidence: high
  evidence: >-
    Penerbit UTM Press, the university's own publishing arm, is Crossref member 4787 with DOI
    prefix 10.11113 and 12,640 registered DOIs. Its flagship journal, Jurnal Teknologi
    (Sciences & Engineering), ISSN 0127-9696 / 2180-3722, carries 6,311 DOIs of which 349 are
    current, with deposits recorded in every year from 2011 through 2026 — so the registration
    relationship is active, not historic. A sampled work resolves to DOI 10.11113/jt.v78.7807,
    publisher "Penerbit UTM Press", member 4787.
  location: https://api.crossref.org/members/4787
  status_code: 200
  secondary_location: https://api.crossref.org/journals/2180-3722
  secondary_status_code: 200
- id: saml
  name: SAML 2.0
  version: '2.0'
  status: confirmed
  x-operator: federation
  confidence: high
  evidence: >-
    Signed SAML 2.0 metadata for UTM's own Entra ID tenant, entityID
    https://sts.windows.net/9c827912-3502-4333-ba47-1b242c3d20e6/, carrying an
    IDPSSODescriptor with protocolSupportEnumeration urn:oasis:names:tc:SAML:2.0:protocol, two
    SingleSignOnService bindings (HTTP-Redirect and HTTP-POST) and one SingleLogoutService
    binding, all at https://login.microsoftonline.com/9c827912-3502-4333-ba47-1b242c3d20e6/saml2,
    plus WS-Federation RoleDescriptors. The tenant is bound to UTM by domain: realm discovery
    on user@utm.my returns FederationBrandName "Universiti Teknologi Malaysia",
    NameSpaceType Managed.
  location: https://login.microsoftonline.com/9c827912-3502-4333-ba47-1b242c3d20e6/federationmetadata/2007-06/federationmetadata.xml
  status_code: 200
  artifact: identity-federation/utm-identity-federation.yml
- id: orcid
  name: ORCID
  status: partial
  x-operator: institution
  confidence: moderate
  evidence: >-
    The UTMIK Repository REST root advertises ORCID integration in its HAL link set — the
    DSpace-CRIS endpoints `orcidhistories`, `orcidqueues` and `oidc` are present alongside
    `profiles` and `researcherprofiles`-style resources, which is how a DSpace-CRIS deployment
    exposes ORCID record synchronisation. Recorded as partial rather than confirmed because
    the collection endpoints beneath the root answered HTTP 403 to this environment, so no
    ORCID identifier was read out of a live record.
  location: https://utmik.utm.my/server/api
  status_code: 200
- id: shibboleth
  name: Shibboleth
  status: not-found
  x-operator: null
  evidence: >-
    No Shibboleth identity provider was found under utm.my (idp.utm.my is NXDOMAIN), UTM does
    not appear in the eduGAIN entity export, and SIFULAN — the Malaysian Access Federation
    whose metadata would settle this — returned HTTP 403 to every probe from this environment.
    UTM federates with Microsoft Entra ID instead. Recorded as not-found rather than
    non-conformant: the deciding source was unreadable, not negative.
- id: datacite
  name: DataCite
  status: not-found
  x-operator: null
  evidence: >-
    api.datacite.org returns zero clients matching "Universiti Teknologi Malaysia" and the
    only Malaysian provider registered is Universiti Malaysia Sarawak. UTM's DOIs are minted
    through Crossref via Penerbit UTM Press, not through DataCite.
- id: scim
  status: not-found
  evidence: No SCIM ServiceProviderConfig or /scim path was found on any UTM host.
- id: lti
  status: not-found
  evidence: >-
    UTM runs Moodle at elearning.utm.my (HTTP 200), but /mod/lti/auth.php,
    /.well-known/jwks.json, /webservice/rest/server.php and /lib/ajax/service.php all returned
    404, so no LTI 1.3 platform contract is publicly readable.
- id: oneroster
  status: not-found
- id: ed-fi
  status: not-found
- id: caliper
  status: not-found
- id: qti
  status: not-found
