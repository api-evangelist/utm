  - date: '2026-09-01'
    rating: 3
    summary: >-
      University-pipeline re-profile with operator attribution settled before anything was
      saved. Three institution-operated surfaces were found that the June 2026 pass missed,
      all verified live: the UTMIK Repository (DSpace-CRIS) OAI-PMH 2.0 endpoint, the UTM
      Press Open Journal Systems OAI-PMH interface, and UTM's Microsoft Entra ID tenant, whose
      signed SAML 2.0 metadata and OpenID Connect discovery document are the most completely
      specified machine contract UTM has. Two registry memberships were recorded: ROR
      026w31v75, and Crossref member 4787 (Penerbit UTM Press, prefix 10.11113, 12,640 DOIs).
      Operator was settled by IP ownership as well as hostname — whois on 161.139.0.0/16
      returns netname UTM-MY — so the repository and journal deployments are UTM's even though
      the software is DSpace-CRIS and PKP OJS; neither product's generic contract was saved
      into this repository. The June profile's DeveloperPortal pointer to digital.utm.my was
      removed: that host is the Office of Quality & Digital Transformation, an administrative
      office, not a developer portal. UTM still publishes no API documentation and no
      specification of its own, and there is no way for an outside developer to obtain a
      credential for anything it runs.
    endpoints:
