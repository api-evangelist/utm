reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      UTM has no public developer portal or documented REST APIs. The main web
      portal, UTM Library, UTMDigital, and the myUTM SSO login were verified
      live (HTTP 200). The strongest machine-consumable interface is the EPrints
      UTM-IR OAI-PMH endpoint, which is documented by ROAR/OpenDOAR/Sherpa
      registries but did not resolve from this environment, so its live status
      is unverified (0). No official UTM GitHub organization was found. No
      endpoints were fabricated; unverified items are flagged as such.
    endpoints:
      - url: https://www.utm.my/
        status: 200
        note: Official UTM web portal, verified live.
      - url: https://library.utm.my/
        status: 200
