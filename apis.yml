x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    UTM operates real institution-owned surfaces and they were read, but nothing it runs is
    consumable as an API by an unaffiliated caller. The two anonymously readable interfaces
    are metadata-harvesting protocols, not APIs UTM designed: OAI-PMH 2.0 on the UTMIK
    DSpace-CRIS repository and on the UTM Press OJS journal platform, both on UTM's own APNIC
    allocation. Every REST interface behind them is closed — the OJS REST API v1 answers 401
    with a JSON authorization error and publishes no route to request a token, and the DSpace
    REST collections answered 403 even though the HAL root is public. The one fully specified
    machine contract, UTM's Microsoft Entra ID tenant, publishes signed SAML 2.0 metadata and
    an OIDC discovery document that anyone can read, but no registration_endpoint, so a
    client_id exists only if UTM Digital creates one. There is no developer portal: the
    www.utm.my sitemap contains exactly one policy page and no API, developer or open-data
    page, api.utm.my resolves and returns HTTP 200 with a 17-byte empty IIS document and 404s
    on every documented path, and no official UTM GitHub organization exists (the two
    name-matching orgs hold zero and one unrelated repository). Two limits are recorded rather
    than treated as findings about UTM. eprints.utm.my, the legacy EPrints repository still
    listed by ROAR, OpenDOAR and Sherpa, refused connections on both ports from three
    independent networks and is not credited as live. And utmik.utm.my answered fully at
    17:26Z on 2026-09-01 — the OAI-PMH responseDate is the server's own proof — then stopped
    answering this environment and two public proxies later the same day, so its pointers may
    grade dead on a re-probe while the surface is real. This is a correct thin profile, not a
    failed probe: more than fifty URLs were fetched successfully across eleven UTM hosts.
