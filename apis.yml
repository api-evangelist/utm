description: >-
  Universiti Teknologi Malaysia (UTM) is a public research university in Johor Bahru and Kuala
  Lumpur, Malaysia, one of the five institutions designated a Research University by the
  Ministry of Higher Education and ranked #181 in the QS World University Rankings 2025. UTM
  publishes no developer portal, no API documentation and no OpenAPI, AsyncAPI or JSON Schema
  of its own, and there is no route by which an unaffiliated developer can obtain a credential
  for anything it runs. Its programmable footprint is entirely made of standards it exposes
  rather than interfaces it designed, and every one of them sits on UTM's own APNIC allocation
  (161.139.0.0/16, netname UTM-MY): the UTMIK Repository, a DSpace-CRIS institutional
  knowledge repository whose OAI-PMH 2.0 endpoint answers anonymously in twelve metadata
  formats including rioxx, etdms and an OpenAIRE CERIF-for-CRIS profile; the UTM Press journal
  platform, whose Open Journal Systems OAI-PMH interface has been harvestable since 2011 and
  whose REST API v1 answers 401; and a Microsoft Entra ID tenant whose signed SAML 2.0
  metadata and OpenID Connect discovery document are the most completely specified machine
  contract in this profile. UTM is registered in ROR, and its own publishing arm, Penerbit UTM
  Press, is Crossref member 4787 with prefix 10.11113 and 12,640 registered DOIs. The older
  EPrints repository at eprints.utm.my, still listed by ROAR, OpenDOAR and Sherpa and still
  linked from the UTM Library, refused connections on both ports from three independent
  networks on 2026-09-01 and is recorded here as unreachable rather than as a surface.
