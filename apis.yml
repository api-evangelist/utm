  removed_detail: >-
    The `DeveloperPortal` pointer to https://digital.utm.my/ was removed. The host is live and
    is a genuine UTM property, but it is the Office of Quality & Digital Transformation
    (UTMDX), an administrative office site — not a developer portal, no API documentation, no
    keys, no registration. Claiming a developer program UTM does not run is the same
    presence-is-not-provenance error the university pipeline exists to prevent, and removing
    it lowers this profile's score, which is the correct outcome.
